name: mycologs-business

services:

  postgres:
    image: postgres:18
    container_name: mycologs-business-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mycologs
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ..
      dockerfile: docker/ai-service/Dockerfile
    container_name: mycologs-business-ai-service
    restart: unless-stopped
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3002/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: mycologs-business-api
    restart: unless-stopped
    # Bound the API's memory so it, and not the kernel, is what gives way under
    # pressure. Unbounded, an image-processing spike (sharp/libvips allocates
    # natively, so the Dockerfile's --max-old-space-size cap does not apply)
    # exhausts the host and the kernel OOM killer picks its own victim — which
    # could be postgres. An unclean postgres kill is what produced the
    # 2026-08-27 clog/toast corruption. With a limit, Docker kills only this
    # container and `restart: unless-stopped` brings it straight back.
    #
    # Sized via API_MEM_LIMIT. Deliberately NO memswap_limit: this host has only
    # 960 MiB of RAM and is leaning on ~1.6 GiB of swap to stay up, so denying
    # this container swap would turn every image-processing spike into an
    # immediate kill. Letting it swap is slow but survivable.
    #
    # These numbers are measured, not estimated — do not lower them without
    # re-measuring. 235d748 sized a 320m limit from "the API idles at 53.9 MiB";
    # in production this container sits at ~460 MiB. The entrypoint is `npx
    # ts-node`, which compiles the whole API in-process before serving anything,
    # and that boot compile — not request handling — is the high-water mark.
    #
    # Both 192m and 384m V8 caps aborted there ("Reached heap limit" /
    # "Ineffective mark-compacts", ~4s after start, before any request arrived),
    # crash-looping the API. 512m is the only value observed to boot. 768m of
    # container gives that heap room for sharp/libvips on top, which allocates
    # natively and is not counted against the V8 cap.
    #
    # Right-sized 2026-08-31 against the compiled API, now that it no longer
    # carries the TypeScript compiler (see docker/api/Dockerfile). Measured in
    # production immediately after that deploy:
    #
    #     idle                        106 MiB
    #     after 5x GET /species       247 MiB   <- heaviest measured request
    #     startup                     1.7 s     (was ~17 s)
    #
    # 512m is deliberately ~2x the observed peak rather than a snug fit around
    # it, because the heaviest path is the one not exercised above: ai-identify
    # decodes images through sharp/libvips, which allocates natively and so is
    # invisible to the V8 cap below. 235d748 measured that work at 82-127 MiB
    # depending on image count. Re-measure after a real identification before
    # going tighter.
    #
    # This still frees ~768 MiB against the 1280m it replaces — the headroom a
    # second (sandbox) stack would need.
    mem_limit: ${API_MEM_LIMIT:-512m}
    ports:
      - "3000:3000"
    environment:
      # Set here rather than relying on the image's ENV so it can be retuned
      # without a rebuild; compose's value wins over the Dockerfile's either way.
      # Must stay below mem_limit above, or the cap cannot bind before Docker
      # kills the container.
      # The compiled API boots with a 31 MB heap, where ts-node needed 481 MB of
      # which 454 MB was unreclaimable. 256m is therefore ~8x the boot cost, and
      # it must stay below mem_limit above so V8 collects before Docker kills.
      # The 256 MiB of slack between the two is for sharp/libvips, which
      # allocates natively and is not counted against this cap.
      NODE_OPTIONS: ${API_NODE_OPTIONS:---max-old-space-size=256}
      DATABASE_URL: postgresql://postgres:password@postgres:5432/mycologs
      AI_SERVICE_URL: http://ai-service:3002
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3001}
      APP_URL: ${APP_URL:-http://localhost:3001}
      API_URL: ${API_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LINE_MESSAGE_CHANNEL_ID: ${LINE_MESSAGE_CHANNEL_ID:-}
      LINE_MESSAGE_CHANNEL_SECRET: ${LINE_MESSAGE_CHANNEL_SECRET:-}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET:-}
      LINE_CALLBACK_URL: ${LINE_CALLBACK_URL:-}
      RESEND_COM_API_KEY: ${RESEND_COM_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      FREE_TIER_CREDITS: ${FREE_TIER_CREDITS:-50}
      AI_IDENTIFICATION_COST: ${AI_IDENTIFICATION_COST:-10}
      INAT_IMAGES_DIR: /app/data/inat-images
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    volumes:
      - ./uploads:/app/data/uploads
      - ./backups:/app/backups
      - ../iNaturalist-images:/app/data/inat-images:ro

  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        INTERNAL_API_URL: http://api:3000
        NEXT_PUBLIC_STRIPE_PRICE_PERSONAL: ${NEXT_PUBLIC_STRIPE_PRICE_PERSONAL:-}
        NEXT_PUBLIC_STRIPE_PRICE_CLUB: ${NEXT_PUBLIC_STRIPE_PRICE_CLUB:-}
        GIT_HASH: ${GIT_HASH:-unknown}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
    restart: unless-stopped
    container_name: mycologs-business-web
    environment:
      INTERNAL_API_URL: http://api:3000
    ports:
      - "3001:3001"
    depends_on:
      - api
