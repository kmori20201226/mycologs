name: mycologs-business

services:

  postgres:
    image: postgres:18
    container_name: mycologs-business-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mycologs
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ..
      dockerfile: docker/ai-service/Dockerfile
    container_name: mycologs-business-ai-service
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:3002/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    container_name: mycologs-business-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/mycologs
      AI_SERVICE_URL: http://ai-service:3002
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      API_URL: ${API_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LINE_MESSAGE_CHANNEL_ID: ${LINE_MESSAGE_CHANNEL_ID:-}
      LINE_MESSAGE_CHANNEL_SECRET: ${LINE_MESSAGE_CHANNEL_SECRET:-}
      LINE_LOGIN_CHANNEL_ID: ${LINE_LOGIN_CHANNEL_ID:-}
      LINE_LOGIN_CHANNEL_SECRET: ${LINE_LOGIN_CHANNEL_SECRET:-}
      LINE_CALLBACK_URL: ${LINE_CALLBACK_URL:-}
      RESEND_COM_API_KEY: ${RESEND_COM_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      FREE_TIER_CREDITS: ${FREE_TIER_CREDITS:-50}
      AI_IDENTIFICATION_COST: ${AI_IDENTIFICATION_COST:-10}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    volumes:
      - ./uploads:/app/data/uploads
      - ./backups:/app/backups

  web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        INTERNAL_API_URL: http://api:3000
        NEXT_PUBLIC_STRIPE_PRICE_PERSONAL: ${NEXT_PUBLIC_STRIPE_PRICE_PERSONAL:-}
        NEXT_PUBLIC_STRIPE_PRICE_CLUB: ${NEXT_PUBLIC_STRIPE_PRICE_CLUB:-}
        GIT_HASH: ${GIT_HASH:-unknown}
        GIT_BRANCH: ${GIT_BRANCH:-unknown}
    container_name: mycologs-business-web
    environment:
      INTERNAL_API_URL: http://api:3000
    ports:
      - "3001:3001"
    depends_on:
      - api
